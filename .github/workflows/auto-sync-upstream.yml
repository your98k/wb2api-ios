name: Auto Sync Upstream

on:
  schedule:
    - cron: '32 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'your98k'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_UPSTREAM: 'chenyynx/wb2api-ios'
      SYNC_BRANCH: ''
    steps:
      - name: Merge upstream safely without checking out repository code
        shell: python
        run: |
          import datetime, json, os, urllib.error, urllib.parse, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          api_url = os.environ['GITHUB_API_URL']
          summary = []

          def api(path, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(api_url + path, data=data, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as error:
                  message = error.read().decode()
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}: {message}') from None

          def fail(message):
              print('::error::' + message.replace('\n', ' '))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('## Upstream sync stopped\n\n' + message + '\n\nNo force push or reset was performed.\n')
              raise SystemExit(1)

          try:
              metadata = api('/repos/' + repo)
              parent = metadata.get('parent', {})
              upstream = parent.get('full_name')
              if not metadata.get('fork') or upstream != os.environ['EXPECTED_UPSTREAM']:
                  fail('Fork parent changed or is unavailable; refusing to change the configured upstream.')
              source_branch = api('/repos/' + upstream)['default_branch']
              target_branch = os.environ['SYNC_BRANCH'] or metadata['default_branch']
              quote = lambda value: urllib.parse.quote(value, safe='')
              source = api('/repos/' + upstream + '/git/ref/heads/' + quote(source_branch))['object']['sha']
              before = api('/repos/' + repo + '/git/ref/heads/' + quote(target_branch))['object']['sha']
              comparison = api('/repos/' + repo + '/compare/' + source + '...' + before)
              if comparison['behind_by']:
                  api('/repos/' + repo + '/merges', 'POST', {
                      'base': target_branch, 'head': source,
                      'commit_message': 'chore: sync upstream ' + upstream + ':' + source_branch})
              after = api('/repos/' + repo + '/git/ref/heads/' + quote(target_branch))['object']['sha']
              verified = api('/repos/' + repo + '/compare/' + source + '...' + after)
              if verified['behind_by'] != 0:
                  fail('Upstream ancestry verification failed; no force push was attempted.')
              summary += ['## Upstream sync verified', '',
                          '- Source: `' + upstream + ':' + source_branch + '`',
                          '- Target: `' + repo + ':' + target_branch + '`',
                          '- Upstream commit: `' + source + '`',
                          '- Result: ' + ('already current' if before == after else 'merged successfully'),
                          '- Existing local commits retained; force push and reset are never used.']

              # Keep this scheduled workflow active when the upstream is quiet for months.
              default_branch = metadata['default_branch']
              default_head = api('/repos/' + repo + '/git/ref/heads/' + quote(default_branch))['object']['sha']
              commit = api('/repos/' + repo + '/git/commits/' + default_head)
              timestamp = datetime.datetime.fromisoformat(commit['committer']['date'].replace('Z', '+00:00'))
              if (datetime.datetime.now(datetime.timezone.utc) - timestamp).days >= 45:
                  heartbeat = api('/repos/' + repo + '/git/commits', 'POST', {
                      'message': 'chore: keep upstream sync schedule active [skip ci]',
                      'tree': commit['tree']['sha'], 'parents': [default_head]})
                  api('/repos/' + repo + '/git/refs/heads/' + quote(default_branch), 'PATCH', {
                      'sha': heartbeat['sha'], 'force': False})
                  summary.append('- Added a content-free keepalive commit after 45 days of inactivity.')
              print('\n'.join(summary))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('\n'.join(summary) + '\n')
          except Exception as error:
              fail(str(error))
